<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./css/tailwind.css" />
    <script
      src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"
      defer
    ></script>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
      integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <link
      rel="icon"
      type="image/png"
      href="./favicon/favicon-96x96.png"
      sizes="96x96"
    />
    <link rel="icon" type="image/svg+xml" href="./favicon/favicon.svg" />
    <link rel="shortcut icon" href="./favicon/favicon.ico" />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="./favicon/apple-touch-icon.png"
    />
    <meta name="apple-mobile-web-app-title" content="iChat" />
    <link rel="manifest" href="./favicon/site.webmanifest" />
    <title>Chat Application</title>
    <link rel="stylesheet" href="./css/styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <div
        class="toast text-sm md:text-lg"
        id="toast"
        role="alert"
        aria-live="assertive"
        aria-atomic="true"
      ></div>

      <div class="chat-panel opacity-0" id="chat-container">
        <header class="chat-header">
          <div class="brand-group">
            <img
              class="brand-mark"
              src="./favicon/favicon.ico"
              alt="Chatzyx logo"
              width="42"
              height="42"
            />
            <div class="brand-copy">
              <span class="eyebrow">Team chat</span>
              <h1>Chatzyx</h1>
            </div>
          </div>

          <div
            class="status-pill"
            title="Active users online"
            aria-label="Active users online"
          >
            <span class="status-dot"></span>
            <span id="clients-total">0 online</span>
          </div>
        </header>

        <div class="name-row">
          <i class="far fa-user user-icon"></i>
          <input
            type="text"
            id="name-input"
            class="name-input"
            aria-label="Your display name"
            value="anonymous"
            maxlength="20"
          />
        </div>

        <div
          class="message-container"
          id="message-container"
          role="log"
          aria-label="Chat messages"
          tabindex="0"
        ></div>

        <form
          class="composer"
          id="message-form"
          aria-label="Send a chat message"
        >
          <input
            type="text"
            id="message-input"
            class="message-input"
            aria-label="Message"
            placeholder="Type a message"
            enterkeyhint="send"
          />

          <input
            type="file"
            id="file-input"
            accept="image/*,video/*,audio/*,.pdf"
            class="hidden-input"
          />

          <button
            type="button"
            id="upload-btn"
            class="action-button upload-btn"
            data-tooltip="Upload file"
            aria-label="Upload file"
            title="Upload file"
          >
            <i class="fas fa-upload"></i>
            <span>Upload</span>
          </button>

          <button
            type="submit"
            class="action-button send-btn"
            data-tooltip="Send message"
            aria-label="Send message"
            title="Send message"
          >
            <i class="fas fa-paper-plane"></i>
            <span>Send</span>
          </button>
        </form>
      </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/moment.js/2.30.1/moment.min.js"></script>
    <script src="./js/client.js" defer></script>
  </body>
</html>
